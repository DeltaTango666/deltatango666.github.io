<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeltaTango666</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
        }

        h1 {
            margin-bottom: 10px;
        }

        #path {
            color: #666;
            margin-bottom: 20px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        a {
            text-decoration: none;
            color: #0969da;
            font-size: 16px;
        }

        a:hover {
            text-decoration: underline;
        }

        .folder {
            font-weight: bold;
        }

        .icon {
            display: inline-block;
            width: 25px;
        }

        .back {
            margin-bottom: 15px;
            display: inline-block;
        }
    </style>
</head>

<body>

    <h1>DeltaTango666</h1>

    <div id="path"></div>

    <a id="back" class="back" href="#" style="display:none;">
        ← Back
    </a>

    <ul id="file-list"></ul>

    <script>
        const username = "DeltaTango666";
        const repository = "deltatango666.github.io";
        const branch = "main";

        const fileList = document.getElementById("file-list");
        const pathDisplay = document.getElementById("path");
        const backButton = document.getElementById("back");

        function getPath() {
            return window.location.hash.substring(1);
        }

        async function loadFolder(path = "") {

            fileList.innerHTML = "";
            pathDisplay.textContent = path ? "/" + path : "/";

            // Back button
            if (path) {
                backButton.style.display = "inline-block";

                const parent = path.substring(0, path.lastIndexOf("/"));

                backButton.onclick = function () {
                    window.location.hash = parent;
                };
            } else {
                backButton.style.display = "none";
            }

            const apiUrl =
                `https://api.github.com/repos/${username}/${repository}/contents/${path}?ref=${branch}`;

            try {
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error(`GitHub API returned ${response.status}`);
                }

                const items = await response.json();

                // Folders first, then files
                items.sort((a, b) => {
                    if (a.type === "dir" && b.type !== "dir") return -1;
                    if (a.type !== "dir" && b.type === "dir") return 1;
                    return a.name.localeCompare(b.name);
                });

items.forEach(item => {
    // Only hide index.html at the root (not in subdirectories)
if (item.name.toLowerCase() === "index.html" && !path) return;

    const li = document.createElement("li");
    const link = document.createElement("a");

    if (item.type === "dir") {
        // Folder
        link.className = "folder";
        link.href = "#" + item.path;
        link.innerHTML = `<span class="icon">📁</span>${item.name}/`;
    } else {
        // File
        if (item.name.toLowerCase().endsWith(".html") || item.name.toLowerCase().endsWith(".htm")) {
            link.href = `https://${username.toLowerCase()}.github.io/${item.path}`;
        } else {
            link.href = item.download_url;
        }
        link.target = "_blank";
        link.innerHTML = `<span class="icon">📄</span>${item.name}`;
    }

    li.appendChild(link);
    fileList.appendChild(li);
});

            } catch (error) {
                fileList.innerHTML =
                    `<li>Unable to load this folder.</li>`;

                console.error(error);
            }
        }

        // Load the current folder
        function navigate() {
            loadFolder(getPath());
        }

        window.addEventListener("hashchange", navigate);

        navigate();
    </script>

</body>
</html>
